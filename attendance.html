<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance · Student Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-mark js-brand-mark">SM</div><div class="brand-text"><strong class="js-institute-name">Brightpath</strong><span>Admin Panel</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a href="students.html" class="nav-link"><i class="fa-solid fa-user-graduate"></i> Students</a>
      <a href="attendance.html" class="nav-link"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
      <a href="fees.html" class="nav-link"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
      <div class="nav-section-label">Academics</div>
      <a href="batches.html" class="nav-link"><i class="fa-solid fa-layer-group"></i> Batches</a>
      <a href="teachers.html" class="nav-link"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
      <a href="exams.html" class="nav-link"><i class="fa-solid fa-file-pen"></i> Exams</a>
      <div class="nav-section-label">System</div>
      <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer"><a href="#" class="nav-link js-logout" style="color:var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title">Attendance<span>Mark and track student attendance</span></div>
      <div class="topbar-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search students, batches..."></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        <button class="icon-btn" id="notifBtn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
        <div class="user-chip"><div class="user-avatar js-user-avatar">A</div><div><div class="u-name js-user-name">Admin</div><div class="u-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="notif-panel" id="notifPanel"><div class="notif-head"><h4>Notifications</h4><button>Mark all read</button></div><div class="notif-list"></div></div>

    <main class="content">
      <div class="tab-row">
        <button class="tab-btn active" data-tab="mark">Mark Attendance</button>
        <button class="tab-btn" data-tab="daily">Daily Report</button>
        <button class="tab-btn" data-tab="monthly">Monthly Report</button>
      </div>

      <!-- MARK ATTENDANCE TAB -->
      <div id="tab-mark">
        <div class="card mb-16">
          <div class="toolbar">
            <div class="form-field" style="min-width:220px;">
              <label>Batch</label>
              <select class="select-filter" id="markBatchSelect"></select>
            </div>
            <div class="form-field">
              <label>Date</label>
              <input type="date" class="select-filter" id="markDate">
            </div>
            <div style="margin-left:auto;align-self:flex-end;" class="flex gap-8">
              <button class="btn btn-outline btn-sm" id="markAllPresent"><i class="fa-solid fa-check-double"></i> Mark all present</button>
              <button class="btn btn-primary" id="saveAttendanceBtn"><i class="fa-solid fa-floppy-disk"></i> Save Attendance</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Roll No.</th><th style="text-align:center;">Status</th></tr></thead>
              <tbody id="markAttendanceBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- DAILY REPORT TAB -->
      <div id="tab-daily" style="display:none;">
        <div class="card">
          <div class="toolbar">
            <div class="form-field"><label>Date</label><input type="date" class="select-filter" id="dailyReportDate"></div>
            <div style="margin-left:auto;" class="flex gap-8">
              <button class="btn btn-outline btn-sm" id="exportDaily"><i class="fa-solid fa-file-export"></i> Export</button>
              <button class="btn btn-outline btn-sm" id="printDaily"><i class="fa-solid fa-print"></i> Print</button>
            </div>
          </div>
          <div class="grid grid-3 mb-16" id="dailyStats"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Batch</th><th>Status</th></tr></thead>
              <tbody id="dailyReportBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- MONTHLY REPORT TAB -->
      <div id="tab-monthly" style="display:none;">
        <div class="card">
          <div class="toolbar">
            <div class="form-field"><label>Month</label><input type="month" class="select-filter" id="monthlyReportMonth"></div>
            <div style="margin-left:auto;" class="flex gap-8">
              <button class="btn btn-outline btn-sm" id="exportMonthly"><i class="fa-solid fa-file-export"></i> Export</button>
              <button class="btn btn-outline btn-sm" id="printMonthly"><i class="fa-solid fa-print"></i> Print</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Batch</th><th>Present Days</th><th>Absent Days</th><th>Attendance %</th></tr></thead>
              <tbody id="monthlyReportBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
